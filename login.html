<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSM Solution - Login</title>
    <link rel="icon" href="data:,">
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            color: #111827;
        }

        .logo-box { 
            background: #111827; 
            color: white; 
            width: 64px; 
            height: 64px; 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 800; 
            font-size: 1.3rem; 
            margin-bottom: 20px; 
            letter-spacing: 0.5px;
        }

        h1 { 
            margin: 0 0 8px 0; 
            font-size: 1.6rem; 
            font-weight: 800;
        }

        p.subtitle { 
            color: #6b7280; 
            font-size: 0.95rem; 
            margin: 0 0 30px 0; 
        }

        .login-card { 
            background: white; 
            border: 1px solid #e5e7eb; 
            border-radius: 12px; 
            padding: 35px 30px; 
            width: 100%; 
            max-width: 320px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        .form-group label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #111827; 
            margin-bottom: 8px; 
        }

        .input-wrapper { 
            position: relative; 
        }

        .input-wrapper input { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid transparent; 
            background: #eff6ff; /* Light blue background from screenshot */
            border-radius: 8px; 
            font-size: 0.95rem; 
            outline: none; 
            box-sizing: border-box; 
            color: #1e3a8a; 
            font-family: inherit;
            transition: border-color 0.2s; 
        }

        .input-wrapper input:focus { 
            border-color: #3b82f6; 
        }

        .eye-icon { 
            position: absolute; 
            right: 12px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #6b7280; 
            cursor: pointer; 
            display: flex;
            align-items: center;
        }

        .btn-login { 
            width: 100%; 
            background: #111827; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 0.95rem; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px; 
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-login:hover { 
            background: #374151; 
        }

        .footer-text { 
            margin-top: 30px; 
            font-size: 0.8rem; 
            color: #9ca3af; 
        }
    </style>
</head>
<body>

    <div class="logo-box">GSM</div>
    <h1>GSM Solution</h1>
    <p class="subtitle">Sign in to continue</p>

    <div class="login-card">
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <input type="email" id="email" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" required>
                    <div class="eye-icon" onclick="togglePassword()" title="Show/Hide Password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                Sign In
            </button>
        </form>
    </div>

    <div class="footer-text">
        Contact your administrator to get access.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://cbsmsclmyyxgwwztqwsc.supabase.co';
        const supabaseKey = 'sb_publishable_wAIQBEnR8-o5R6Ic48efGQ_zomyZiJ-';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        function togglePassword() {
            const passInput = document.getElementById('password');
            if (passInput.type === 'password') {
                passInput.type = 'text';
            } else {
                passInput.type = 'password';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Signing in...";
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await db.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Login Failed: " + error.message);
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg> Sign In`;
                btn.disabled = false;
            } else {
                window.location.href = 'index.html'; // Redirect to dashboard on success
            }
        }
    </script>
</body>
</html>
